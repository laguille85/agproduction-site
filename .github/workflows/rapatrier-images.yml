name: Rapatrier les images
on:
  push:
    branches: [main]
    paths: ["outils/images-a-rapatrier.txt", "outils/rapatrier.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rapatrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 outils/rapatrier.py
      - name: Enregistrer les images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/externes
          git diff --cached --quiet || git commit -m "Images rapatriées depuis Adobe Portfolio"
          git push
